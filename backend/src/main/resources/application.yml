server:
  address: 127.0.0.1

spring:
  application:
    name: emos
  datasource:
    url: ${EMOS_DB_URL:jdbc:postgresql://localhost:5432/emos}
    username: ${EMOS_DB_USER:emos}
    password: ${EMOS_DB_PASSWORD:emos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

emos:
  github:
    enabled: ${EMOS_GITHUB_ENABLED:false}
    base-url: ${EMOS_GITHUB_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    organization: ${EMOS_GITHUB_ORGANIZATION:}
  recommendations:
    enabled: ${EMOS_RECOMMENDATIONS_ENABLED:false}
    base-url: ${EMOS_OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${EMOS_OPENAI_MODEL:}
  calendar:
    zone: ${EMOS_CALENDAR_ZONE:Asia/Kolkata}
    holidays: ${EMOS_CALENDAR_HOLIDAYS:}
  datadog:
    enabled: ${EMOS_DATADOG_ENABLED:false}
    base-url: ${EMOS_DATADOG_BASE_URL:https://api.datadoghq.com}
    api-key: ${EMOS_DATADOG_API_KEY:}
    application-key: ${EMOS_DATADOG_APPLICATION_KEY:}
  jsm:
    enabled: ${EMOS_JSM_ENABLED:false}
    base-url: ${EMOS_JSM_BASE_URL:https://api.atlassian.com/jsm/ops}
    cloud-id: ${EMOS_JSM_CLOUD_ID:}
    email: ${EMOS_JSM_EMAIL:}
    token: ${EMOS_JSM_TOKEN:}
    scheduling-enabled: ${EMOS_JSM_SCHEDULING_ENABLED:${EMOS_JSM_ENABLED:false}}
    poll-interval: ${EMOS_JSM_POLL_INTERVAL:PT2M}
