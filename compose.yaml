services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: emos
      POSTGRES_USER: emos
      POSTGRES_PASSWORD: emos
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emos -d emos']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - emos-postgres-data:/var/lib/postgresql/data

volumes:
  emos-postgres-data:
